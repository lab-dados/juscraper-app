name: Testar tribunais (proxy)

# Roda o juscraper de cada tribunal PELO PROXY CORS (mesmo caminho de rede do app
# publicado) e reporta, por tribunal/endpoint, quais estao funcionando. Serve de
# monitor de regressoes: se um tribunal cair (mudanca no site, quebra no proxy),
# a execucao agendada falha e o resumo mostra exatamente qual.

on:
  schedule:
    - cron: "30 9 * * *" # diariamente, 09:30 UTC (~06:30 BRT)
  workflow_dispatch:
    inputs:
      proxy_url:
        description: "URL do proxy CORS (default: proxy de producao)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: test-tribunais
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Override manual via workflow_dispatch; vazio -> default do proxy_session.py.
      JUSCRAPER_PROXY_URL: ${{ github.event.inputs.proxy_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Sincronizar dependencias (com dev)
        run: uv sync --group dev
      - name: Instalar juscraper do wheel vendorizado (mesmo codigo do app)
        # O app carrega o juscraper do wheel em web/public/wheels/ (build do git
        # HEAD), que pode divergir do PyPI mesmo com a mesma versao. Testar contra
        # o wheel evita falsos resultados (ex.: tjpe passa no app mas falhava no PyPI).
        run: |
          WHEEL=$(uv run python -c "import json;print(json.load(open('web/public/wheels/manifest.json'))['wheel'])")
          echo "Instalando web/public/wheels/$WHEEL"
          uv pip install --no-deps --reinstall "web/public/wheels/$WHEEL"
      - name: Rodar testes dos tribunais
        id: pytest
        # Monitor (nao-gate): bater em 25 sites de tribunais ao vivo produz 5xx/403
        # transitorios em qualquer dia. Falhar o job nisso vira ruido (email vermelho
        # diario por blip de servidor). O valor esta no RESUMO por tribunal abaixo e
        # no report.xml. `continue-on-error` deixa o job verde; o status real de cada
        # tribunal aparece na tabela do Summary. Para gating/alerta, ver nota no README.
        continue-on-error: true
        run: uv run pytest tests/ -v --junitxml=report.xml
      - name: Resumo por tribunal
        if: always()
        run: uv run python scripts/junit_summary.py report.xml >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar report.xml
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: report-tribunais
          path: report.xml
