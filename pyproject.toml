[project]
name = "juscraper-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jtrecenti", email = "julio.trecenti@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jupyter>=1.1.1",
    "juscraper>=0.3.0",
]

[project.scripts]
juscraper-app = "juscraper_app:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Deps de runtime do juscraper. Como o CI instala o wheel vendorizado com
    # --no-deps (ver .github/workflows/test-tribunais.yml), o ambiente de teste
    # precisa prover as mesmas libs que o app injeta no Pyodide (web/src/pyodide/
    # glue.py::_DEPS) — em especial o lxml, que o parser de varios tribunais exige.
    "pandas",
    "beautifulsoup4",
    "lxml",
    "requests",
    "pydantic",
    "tqdm",
    "Unidecode",
    "pyjwt",
    "python-dotenv",
    "openpyxl",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: testes que fazem requisicoes de rede reais (tribunais via proxy)",
]
# Saida concisa por padrao; -v lista cada tribunal.
addopts = "-ra"
